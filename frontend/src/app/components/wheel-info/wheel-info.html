<div class="card bg-base-300">
        <div class="card-body p-0">
                <div
                        class="grid grid-cols-2 gap-8 p-6 w-fit">
                        <ng-container
                                *ngTemplateOutlet="wheelCard; context: { data: wheels.frontLeft, label: 'FL' }"></ng-container>
                        <ng-container
                                *ngTemplateOutlet="wheelCard; context: { data: wheels.frontRight, label: 'FR' }"></ng-container>
                        <ng-container
                                *ngTemplateOutlet="wheelCard; context: { data: wheels.rearLeft, label: 'RL' }"></ng-container>
                        <ng-container
                                *ngTemplateOutlet="wheelCard; context: { data: wheels.rearRight, label: 'RR' }"></ng-container>

                        <ng-template #wheelCard let-data="data" let-label="label">
                                <div
                                        class="flex flex-col gap-2 bg-neutral/20 p-3 rounded-lg border border-white/5 min-w-40">

                                        <div class="flex justify-between items-center mb-1">
                                                <span class="text-xs font-black italic opacity-40">{{ label }}</span>
                                                <span class="text-[10px] font-mono text-primary">{{ data.pressure }}
                                                        PSI</span>
                                        </div>

                                        <div class="flex gap-2 items-center">
                                                <div
                                                        class="flex h-16 w-10 rounded border border-black/40 overflow-hidden shadow-inner bg-black/20">
                                                        <div class="w-1/3 h-full opacity-80"
                                                                [ngClass]="getTyreColor(data.temp.outer)"></div>
                                                        <div class="w-1/3 h-full"
                                                                [ngClass]="getTyreColor(data.temp.middle)"></div>
                                                        <div class="w-1/3 h-full opacity-80"
                                                                [ngClass]="getTyreColor(data.temp.inner)"></div>
                                                </div>

                                                <div class="flex flex-col justify-center flex-1">
                                                        <div class="flex items-center gap-1">
                                                                <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3"
                                                                        [ngClass]="getBrakeColor(data.brakeTemp)"
                                                                        viewBox="0 0 24 24" fill="none"
                                                                        stroke="currentColor" stroke-width="3">
                                                                        <circle cx="12" cy="12" r="10" />
                                                                        <path d="M12 8v8" />
                                                                        <path d="M8 12h8" />
                                                                </svg>
                                                                <span class="text-lg font-mono font-black italic leading-none"
                                                                        [ngClass]="getBrakeColor(data.brakeTemp)">
                                                                        {{ data.brakeTemp }}°
                                                                </span>
                                                        </div>
                                                        <div class="mt-2 flex flex-col gap-0.5">
                                                                <div
                                                                        class="flex justify-between text-[8px] font-bold opacity-40 uppercase">
                                                                        <span>Wear</span>
                                                                        <span>{{ data.wear }}%</span>
                                                                </div>
                                                                <progress class="progress progress-success h-1 w-full"
                                                                        [value]="data.wear" max="100"></progress>
                                                        </div>
                                                </div>
                                        </div>

                                        <div class="bg-black/40 rounded py-1 text-center border border-white/5">
                                                <span
                                                        class="text-[9px] font-bold opacity-40 uppercase block leading-none mb-1">Core
                                                        Temp</span>
                                                <span class="text-xs font-mono font-bold text-white">{{ data.temp.core
                                                        }}°C</span>
                                        </div>
                                </div>
                        </ng-template>

                </div>
        </div>
</div>
