<div class="card bg-base-100">
        <div class="card-body p-0">


                <div class="flex flex-col gap-4 p-4 border-l border-white/5 h-full w-80">
                        <div class="flex items-center justify-between">
                                <h3 class="text-[10px] font-black uppercase tracking-[0.2em] text-primary">Lap Temp
                                        Evolution</h3>
                                <div class="badge badge-outline badge-xs opacity-50 font-mono text-[9px]">Last Lap</div>
                        </div>

                        <div class="flex-1 min-h-50 relative">
                                <canvas baseChart [data]="lineChartData" [options]="lineChartOptions" [type]="'line'">
                                </canvas>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mt-2">
                                <div class="bg-neutral/40 p-2 rounded border-l-2 border-error">
                                        <span class="text-[8px] uppercase font-bold opacity-40 block">Max FL</span>
                                        <span class="text-sm font-black italic">110°C</span>
                                </div>
                                <div class="bg-neutral/40 p-2 rounded border-l-2 border-info">
                                        <span class="text-[8px] uppercase font-bold opacity-40 block">Max FR</span>
                                        <span class="text-sm font-black italic">98°C</span>
                                </div>
                        </div>

                        <div class="divider opacity-5 my-0"></div>

                        <div class="bg-primary/5 p-3 rounded-lg border border-primary/10">
                                <div class="flex items-center gap-2 mb-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3 text-primary"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                                                <path d="m19 11-4-4-4 4m-9 2 4 4 4-4" />
                                        </svg>
                                        <span class="text-[9px] font-black uppercase italic">Thermal Analysis</span>
                                </div>
                                <p class="text-[10px] opacity-60 leading-relaxed">
                                        Slight overheating in <span class="text-error font-bold text-[9px]">Sector
                                                2</span> hairpin. Recommend brake bias adjustment (+1% Front).
                                </p>
                        </div>
                </div>
        </div>
</div>
