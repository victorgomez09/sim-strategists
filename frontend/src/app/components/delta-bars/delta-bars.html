<div class="card w-full bg-base-300 overflow-hidden">
  <div class="card-body p-4 flex flex-col items-center w-full">
    
    <div class="w-full flex justify-between items-end mb-2 px-1 font-mono">
      <div class="flex flex-col">
        <span class="text-[9px] font-black opacity-40 uppercase tracking-widest leading-none mb-1">Reference</span>
        <span class="text-xl font-black text-white italic leading-none">{{ bestLap }}</span>
      </div>

      <div class="text-3xl font-black italic tracking-tighter leading-none" [ngClass]="deltaColorClass">
        {{ delta > 0 ? '+' : '' }}{{ delta | number:'1.2-2' }}
      </div>

      <div class="text-right flex flex-col">
        <span class="text-[9px] font-black opacity-40 uppercase tracking-widest leading-none mb-1">Live Delta</span>
        <span class="text-xs font-black text-primary italic">VS BEST</span>
      </div>
    </div>

    <div class="relative w-full h-10 bg-neutral/30 rounded border border-white/5 overflow-hidden flex items-center">
      
      <div class="absolute inset-y-0 left-1/2 w-0.5 bg-white/60 z-30 shadow-[0_0_8px_rgba(255,255,255,0.5)]"></div>

      <div class="absolute inset-0 flex justify-between px-0 opacity-10 pointer-events-none z-10">
        <div class="h-full w-px bg-white ml-[10%]"></div>
        <div class="h-full w-px bg-white ml-[15%]"></div>
        <div class="h-full w-px bg-white mr-[15%]"></div>
        <div class="h-full w-px bg-white mr-[10%]"></div>
      </div>

      <div class="absolute right-1/2 h-full flex justify-end items-center transition-all duration-100 ease-out z-20"
           [style.width]="delta <= 0 ? barWidth : '0%'">
        <div class="h-full w-full opacity-80" [ngClass]="barColorClass"></div>
      </div>

      <div class="absolute left-1/2 h-full flex justify-start items-center transition-all duration-100 ease-out z-20"
           [style.width]="delta > 0 ? barWidth : '0%'">
        <div class="h-full w-full opacity-80" [ngClass]="barColorClass"></div>
      </div>
    </div>

    <div class="w-full flex justify-between px-1 mt-1.5 text-[8px] font-mono font-black opacity-30 uppercase tracking-[0.2em]">
      <span class="w-12 text-left">-1.0s</span>
      <span class="w-12 text-center">-0.5s</span>
      <span class="text-white opacity-100">Optimal</span>
      <span class="w-12 text-center">+0.5s</span>
      <span class="w-12 text-right">+1.0s</span>
    </div>

  </div>
</div>
