<div class="card w-full p-4 bg-base-300">
  <div class="card-body p-0 flex flex-col items-center w-full">
    <div class="w-full flex justify-between items-end mb-1 px-2 font-mono">
      <div class="flex flex-col">
        <span class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">Reference Lap</span>
        <span class="text-xl font-black text-white italic">{{ bestLap }}</span>
      </div>

      <div class="text-2xl font-black italic tracking-tighter leading-none" [ngClass]="deltaColorClass">
        {{ delta > 0 ? '+' : '' }}{{ delta | number:'1.3-3' }}
      </div>

      <div class="text-right flex flex-col">
        <span class="text-[10px] font-bold opacity-40 uppercase tracking-tighter">Session Delta</span>
        <span class="text-xs font-bold text-primary">VS BEST</span>
      </div>
    </div>

    <div
      class="relative w-full h-8 bg-neutral/40 rounded-md border border-white/5 overflow-hidden flex items-center justify-center">

      <div class="absolute inset-y-0 left-1/2 w-0.5 bg-white/40 z-20 shadow-[0_0_5px_white]"></div>

      <div class="absolute inset-0 flex justify-between px-[10%] opacity-10 pointer-events-none">
        <div class="h-full w-px bg-white"></div>
        <div class="h-full w-px bg-white"></div>
        <div class="h-full w-px bg-white"></div>
        <div class="h-full w-px bg-white"></div>
      </div>

      <div class="absolute right-1/2 h-full flex justify-end items-center transition-all duration-75 ease-out"
        [style.width]="delta <= 0 ? barWidth : '0%'">
        <div class="h-4/5 w-full rounded-l-sm" [ngClass]="barColorClass"></div>
      </div>

      <div class="absolute left-1/2 h-full flex justify-start items-center transition-all duration-75 ease-out"
        [style.width]="delta > 0 ? barWidth : '0%'">
        <div class="h-4/5 w-full rounded-r-sm" [ngClass]="barColorClass"></div>
      </div>
    </div>

    <div
      class="w-full flex justify-between px-2 mt-1 text-[9px] font-mono font-bold opacity-30 uppercase tracking-widest">
      <span>-1.0s</span>
      <span>-0.5s</span>
      <span>Optimal</span>
      <span>+0.5s</span>
      <span>+1.0s</span>
    </div>
  </div>
</div>
